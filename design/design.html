<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitTrack — Clean UI Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
:root {
  --bg: #e9eeea;
  --phone: #090b0e;
  --panel: #15191e;
  --panel2: #1c2127;
  --lime: #b6ff36;
  --text: #f5f7f6;
  --muted: #8e96a0;
  --line: #252b32;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); font-family: 'Inter', sans-serif; color: #161b18; }
header { max-width: 1280px; margin: 32px auto 16px; padding: 0 24px; }
header h1 { margin: 4px 0; font-size: 28px; letter-spacing: -0.6px; }
header p { color: #546057; font-size: 14px; margin: 0; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 315px));
  gap: 26px;
  justify-content: center;
  padding: 20px 24px 56px;
}
figure { margin: 0; }
figcaption {
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #49544c;
  display: flex;
  justify-content: space-between;
}
.phone {
  height: 660px;
  border: 7px solid #22262a;
  border-radius: 34px;
  background: var(--phone);
  color: var(--text);
  position: relative;
  overflow: hidden;
  padding: 20px 18px 72px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 18px 36px rgba(15, 25, 18, 0.14);
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 18px;
}
.top-bar span.muted { color: var(--muted); font-weight: 500; }

.progress { display: flex; gap: 6px; margin-bottom: 24px; }
.progress span { height: 3px; border-radius: 4px; background: var(--line); flex: 1; }
.progress .on { background: var(--lime); }

/* Splash styling matching reference mark */
.splash-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: radial-gradient(circle at 50% 35%, rgba(182, 255, 54, 0.12), transparent 65%);
}
.brand-f {
  font-size: 74px;
  font-weight: 900;
  font-style: italic;
  color: var(--lime);
  line-height: 0.9;
  letter-spacing: -4px;
  margin-bottom: 8px;
}
.brand-name { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
.brand-tag { font-size: 13px; color: var(--muted); line-height: 1.5; margin-top: 8px; }

h2 { font-size: 24px; line-height: 1.18; margin: 0 0 8px; letter-spacing: -0.6px; }
h2 .lime { color: var(--lime); }
p.sub { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0 0 20px; }

.input-field {
  background: var(--panel);
  border: 1px solid var(--lime);
  border-radius: 14px;
  padding: 15px 16px;
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.option {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px;
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.option.selected { border-color: var(--lime); }
.icon-box {
  width: 38px; height: 38px;
  background: var(--panel2);
  border-radius: 11px;
  display: grid; place-items: center;
  color: var(--text);
  flex-shrink: 0;
}
.option.selected .icon-box { color: var(--lime); }
.option b { display: block; font-size: 13px; margin-bottom: 2px; }
.option small { color: var(--muted); font-size: 11px; }
.radio {
  margin-left: auto; width: 17px; height: 17px;
  border-radius: 50%; border: 1.5px solid var(--muted);
  display: grid; place-items: center;
}
.option.selected .radio { border-color: var(--lime); background: var(--lime); }

.days { display: flex; gap: 5px; margin: 10px 0 20px; }
.day {
  background: var(--panel); border: 1px solid var(--line);
  padding: 10px 0; border-radius: 10px; text-align: center;
  font-size: 11px; flex: 1; color: var(--muted); font-weight: 600;
}
.day.sel { background: var(--lime); color: #090b0e; font-weight: 800; border-color: var(--lime); }

.btn {
  position: absolute; bottom: 18px; left: 18px; right: 18px;
  background: var(--lime); color: #090b0e; border: 0;
  border-radius: 14px; height: 48px; font-weight: 800; font-size: 13px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}

/* Home & Connected Screens */
.hero {
  background: var(--lime); color: #090b0e;
  border-radius: 16px; padding: 16px; margin-bottom: 16px;
}
.hero-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.75; }
.hero h3 { margin: 4px 0 6px; font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
.hero-meta { display: flex; gap: 12px; font-size: 11px; font-weight: 600; opacity: 0.85; }
.hero-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #090b0e; color: var(--lime);
  padding: 7px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; margin-top: 12px;
}

.sec-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; font-weight: 700; margin: 14px 0 10px;
}
.sec-head span { color: var(--lime); font-size: 11px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; padding: 11px; }
.stat strong { display: block; color: var(--text); font-size: 15px; margin: 6px 0 2px; }
.stat span { font-size: 10px; color: var(--muted); }

.row-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 13px; padding: 11px 12px; margin-bottom: 9px;
  display: flex; align-items: center; gap: 11px;
}
.row-card b { font-size: 12.5px; display: block; margin-bottom: 2px; }
.row-card small { font-size: 10.5px; color: var(--muted); }
.chevron { margin-left: auto; color: var(--lime); }

.nav {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: #101317; border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 10px 4px;
  font-size: 10px; color: var(--muted);
}
.nav span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.nav .active { color: var(--lime); font-weight: 700; }
svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<header>
  <h1>FitTrack — 11-Screen Clean UI Concept</h1>
  <p>Zero emojis, crisp vector icons, balanced splash screen, name onboarding, 3-step profile setup, connected home screens, and settings.</p>
</header>

<main class="grid">

  <!-- 01 SPLASH SCREEN -->
  <figure>
    <figcaption>01 · Splash Screen</figcaption>
    <div class="phone">
      <div class="top-bar"><span>9:41</span><span class="muted">5G · 100%</span></div>
      <div class="splash-center">
        <div class="brand-f">F</div>
        <div class="brand-name">FitTrack</div>
        <div class="brand-tag">Train Smarter /<br>Get Stronger</div>
      </div>
      <button class="btn">
        Get Started
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </figure>

  <!-- 02 ENTER YOUR NAME -->
  <figure>
    <figcaption>02 · Enter Your Name</figcaption>
    <div class="phone">
      <div class="top-bar"><span>9:41</span><span class="muted">Step 1</span></div>
      <h2>What's Your<br><span class="lime">First Name?</span></h2>
      <p class="sub">Personalize your AI workout plans, daily targets, and coaching prompts.</p>
      <label style="font-size:11px; color:var(--muted); margin-bottom:8px; display:block;">Your Name</label>
      <div class="input-field">
        <span>Aizaz</span>
        <svg style="color:var(--lime)" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <button class="btn">
        Continue
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </figure>

  <!-- 03 PROFILE SETUP 1/3: GOAL -->
  <figure>
    <figcaption>03 · Profile Setup (1/3) — Goal</figcaption>
    <div class="phone">
      <div class="top-bar"><span>9:41</span><span class="muted">1 of 3</span></div>
      <div class="progress"><span class="on"></span><span></span><span></span></div>
      <h2>What's Your<br><span class="lime">Fitness Goal?</span></h2>
      <p class="sub">Choose one goal to get a Gemini AI personalized workout plan.</p>
      <div class="option selected">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M9 4v16M15 4v16"/></svg></div>
        <div><b>Build Muscle</b><small>Gain strength and lean muscle mass</small></div>
        <div class="radio"></div>
      </div>
      <div class="option">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></div>
        <div><b>Lose Weight</b><small>Burn calories and improve conditioning</small></div>
        <div class="radio"></div>
      </div>
      <div class="option">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        <div><b>Stay Fit</b><small>Improve overall health and stamina</small></div>
        <div class="radio"></div>
      </div>
      <button class="btn">
        Continue
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </figure>

  <!-- 04 PROFILE SETUP 2/3: FITNESS LEVEL -->
  <figure>
    <figcaption>04 · Profile Setup (2/3) — Level</figcaption>
    <div class="phone">
      <div class="top-bar"><span>9:41</span><span class="muted">2 of 3</span></div>
      <div class="progress"><span class="on"></span><span class="on"></span><span></span></div>
      <h2>What's Your<br><span class="lime">Fitness Level?</span></h2>
      <p class="sub">This helps us calibrate training volume and intensity.</p>
      <div class="option">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div>
        <div><b>Beginner</b><small>New to working out (0–3 months)</small></div>
        <div class="radio"></div>
      </div>
      <div class="option selected">
        <div class="icon-box"><svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
        <div><b>Intermediate</b><small>3–12 months of consistent training</small></div>
        <div class="radio"></div>
      </div>
      <div class="option">
        <div class="icon-box"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <div><b>Advanced</b><small>More than a year of experience</small></div>
        <div class="radio"></div>
      </div>
      <button class="btn">
        Continue
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </figure>

  <!-- 05 PROFILE SETUP 3/3: SET ROUTINE -->
  <figure>
    <figcaption>05 · Profile Setup (3/3) — Routine</figcaption>
    <div class="phone">
      <div class="top-bar"><span>9:41</span><span class="muted">3 of 3</span></div>
      <div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span></div>
      <h2>Set Your<br><span class="lime">Workout Routine</span></h2>
      <p class="sub">Choose the days and preferred time to train.</p>
      <b style="font-size:12px;">Select Days</b>
      <div class="days">
        <div class="day sel">Mon</div><div class="day">Tue</div><div class="day sel">Wed</div>
        <div class="day">Thu</div><div class="day sel">Fri</div><div class="day">Sat</div><div class="day">Sun</div>
      </div>
      <b style="font-size:12px; display:block; margin-bottom:10px;">Choose Time</b>
      <div class="option selected">
        <div class="icon-box"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg></div>
        <div><b>Morning</b><small>06:00 – 09:00</small></div>
        <div class="radio"></div>
      </div>
      <div class="option">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></div>
        <div><b>Evening</b><small>18:00 – 21:00</small></div>
        <div class="radio"></div>
      </div>
      <button class="btn">
        Start My Journey
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </figure>

  <!-- 06 HOME DASHBOARD -->
  <figure>
    <figcaption>06 · Home Dashboard</figcaption>
    <div class="phone">
      <div class="top-bar"><span class="muted">Ready to train,</span><span style="color:var(--lime)">AI Synced</span></div>
      <h2 style="font-size:20px; margin-bottom:14px;">Hey, <span class="lime">Aizaz</span></h2>
      <div class="hero">
        <div class="hero-tag">Today's Workout</div>
        <h3>Upper Body Strength</h3>
        <div class="hero-meta">
          <span>45 min</span>
          <span>·</span>
          <span>6 exercises</span>
          <span>·</span>
          <span>320 kcal</span>
        </div>
        <div class="hero-btn">
          <svg style="width:13px;height:13px" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Start Workout
        </div>
      </div>
      <div class="sec-head">Weekly Progress <span>Details</span></div>
      <div class="stats">
        <div class="stat">
          <svg style="color:var(--lime);width:15px;height:15px" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <strong>3/5</strong><span>Workouts</span>
        </div>
        <div class="stat">
          <svg style="color:var(--lime);width:15px;height:15px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <strong>2.5 hrs</strong><span>Active Time</span>
        </div>
        <div class="stat">
          <svg style="color:var(--lime);width:15px;height:15px" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <strong>1,250</strong><span>Calories</span>
        </div>
      </div>
      <div class="sec-head">Recent Workouts <span>See All</span></div>
      <div class="row-card">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M9 4v16M15 4v16"/></svg></div>
        <div><b>Upper Body Strength</b><small>Yesterday · 40 min</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="nav">
        <span class="active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</span>
        <span><svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M9 4v16M15 4v16"/></svg>Workouts</span>
        <span><svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>Nutrition</span>
        <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</span>
      </div>
    </div>
  </figure>

  <!-- 07 CONNECTED: WORKOUTS & AI PLAN -->
  <figure>
    <figcaption>07 · Connected: Workouts</figcaption>
    <div class="phone">
      <div class="top-bar"><span>Workouts</span><span style="color:var(--lime)">Gemini AI</span></div>
      <h2>Personal <span class="lime">Plan</span></h2>
      <p class="sub">Customized for Build Muscle · Intermediate.</p>
      <div class="row-card" style="border-color:var(--lime)">
        <div class="icon-box" style="color:var(--lime)"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <div><b>Regenerate with Gemini AI</b><small>Adapt exercises to equipment or soreness</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="row-card">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M9 4v16M15 4v16"/></svg></div>
        <div><b>Upper Body Strength</b><small>Mon · 45 min · 6 exercises</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="row-card">
        <div class="icon-box"><svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg></div>
        <div><b>Lower Body Power</b><small>Wed · 50 min · 5 exercises</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="row-card">
        <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        <div><b>Core & Conditioning</b><small>Fri · 30 min · 4 exercises</small></div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="nav">
        <span><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</span>
        <span class="active"><svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M9 4v16M15 4v16"/></svg>Workouts</span>
        <span><svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>Nutrition</span>
        <span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>Settings</span>
      </div>
    </div>
  </figure>

  <!-- 08 CONNECTED: ACTIVE WORKOUT SESSION -->
  <figure>
    <figcaption>08 · Connected: Active Session</figcaption>
    <div class="phone">
      <div class="top-bar"><span>← Back</span><span style="color:var(--lime)">18:42</span></div>
      <h2>Upper Body<br><span class="lime">Strength</span></h2>
      <p class="sub">2 of 6 exercises completed</p>
      <div class="row-card" style="border-color:var(--lime)">
        <div class="icon-box" style="color:var(--lime)"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div><b>Incline Dumbbell Press</b><small>3 sets × 10 reps · Done</small></div>
      </div>
      <div class="row-card" style="border-color:var(--lime)">
        <div class="icon-box" style="color:var(--lime)"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div><b>Lat Pulldown</b><small>3 sets × 12 reps · Done</small></div>
      </div>
      <div class="row-card">
        <div class="icon-box">3</div>
        <div><b>Seated Shoulder Press</b><small>3 sets × 10 reps · Next</small></div>
      </div>
      <button class="btn">Finish Workout</button>
    </div>
  </figure>

  <!-- 09 CONNECTED: PROGRESS & ANALYTICS -->
  <figure>
    <figcaption>09 · Connected: Progress</figcaption>
    <div class="phone">
